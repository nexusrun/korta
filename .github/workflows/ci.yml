name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: .go-version
      - run: make check
      - name: Build every release platform
        run: scripts/dist.sh v0.0.0-ci

  # Every commit in a pull request certifies the Developer Certificate of
  # Origin with a sign-off matching its author; see CONTRIBUTING.md.
  dco:
    name: Commits are signed off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check Signed-off-by
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            author=$(git log -1 --format='%an <%ae>' "$c")
            if ! git log -1 --format=%B "$c" | grep -qF "Signed-off-by: $author"; then
              echo "::error::$(git log -1 --format='%h %s' "$c") is not signed off by its author, $author"
              missing=1
            fi
          done
          if [ "$missing" = 1 ]; then
            echo "Sign off with git commit -s. For commits already made: git rebase --signoff $BASE && git push --force-with-lease"
            exit 1
          fi

