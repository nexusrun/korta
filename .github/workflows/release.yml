name: Release

# scripts/release.sh pushes an annotated tag; this builds and publishes it,
# with the tag's message as the release notes.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Checkout leaves a lightweight copy of the tag; fetch its message.
      - run: git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
      - uses: actions/setup-go@v5
        with:
          go-version-file: .go-version
      - run: make check
      - run: scripts/dist.sh "$GITHUB_REF_NAME"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -l --format='%(contents:body)' "$GITHUB_REF_NAME" > notes.md
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md $prerelease
